{% set name = "rnc2rng" %}
{% set version = "2.8.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/rnc2rng-{{ version }}.tar.gz
  sha256: e6213f96dc88f0b499b281f038a53ed6dc1f21dae8bf822b9fdee9406468a2a6

build:
  entry_points:
    - rnc2rng = rnc2rng.__main__:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python >=3.6
  run:
    - python >=3.6
    - rply

test:
  source_files:
    - test.py
    - tests
  imports:
    - rnc2rng
  commands:
    - pip check
    - python test.py
  requires:
    - pip

about:
  home: https://github.com/djc/rnc2rng
  summary: RELAX NG Compact to regular syntax conversion library
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - maxb2
